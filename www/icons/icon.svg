<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Inner Glass Accent -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#glowGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
  
  <!-- Outer Clock / Orbit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="14" stroke-dasharray="12 8" />
  
  <!-- Inner Target Ring with Gradient -->
  <circle cx="256" cy="256" r="120" fill="rgba(15, 23, 42, 0.45)" stroke="rgba(255,255,255,0.7)" stroke-width="8" filter="url(#shadow)" />
  
  <!-- Glowing Checkmark & Clock Hand Combined -->
  <path d="M 180 260 L 235 315 L 340 195" fill="none" stroke="#38bdf8" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
  <path d="M 180 260 L 235 315 L 340 195" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Sun Rays / Orbit Dots -->
  <circle cx="256" cy="76" r="14" fill="#fbbf24" filter="url(#shadow)" />
  <circle cx="436" cy="256" r="10" fill="#a78bfa" />
  <circle cx="256" cy="436" r="10" fill="#38bdf8" />
  <circle cx="76" cy="256" r="10" fill="#34d399" />
</svg>
